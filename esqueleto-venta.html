<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="inventario">
        <h1>
            STOCK ACTUAL 
        </h1>

        <div>
            <table id="tabla-inventario">
                <tr class="impar">
                    <th>Producto</th>
                    <th>Stock Actual</th>
                    <th>Stock Mínimo</th>
                </tr>
                <tr class="par">
                    <td>Leche</td>
                    <td>20</td>
                    <td>15</td>
                </tr>
                <tr class="impar">
                    <td>Arroz</td>
                    <td>12</td>
                    <td>10</td>
                </tr>
            </table>

            <div id="contenedor-btn-inventario">
                <button id="btn-mov-inventario" onclick="movimientoInventario()"> VER MOVIMIENTOS</button>
                <button id="btn-bajo-stock" onclick="bajoStock()"> BAJO STOCK </button>
                <button id="btn-actualizar-stock" onclick="actualizarStockMinimo()"> ACTUALIZAR STOCK MÍNIMO </button>
            </div>
        </div>
    </div>
</body>
</html>
