<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilos.css">
    <title>login usuarios</title>
    <script src="funciones.js" defer></script>

</head>

<body>
    <div id="login">
        <div id="contenedor-formulario-login">
            <h1 id="titulo">RINCON DE LA TÍA CECI</h1>
            <form id="form-login">
                <fieldset id="field">
                    <legend> INICIAR SESIÓN</legend>
                    <div class="grupo-campo">
                        <label campo-usuario>Usuario </label>
                        <br>
                        <input type="text" name="campo-usuario" id="campo-usuario" placeholder="ej: juanito12">
                        <br>
                        <span class="mensaje-error" id="mensaje-usuario"></span>
                    </div>
                    <br>


                    <div class="grupo-campo">
                        <label for="campo-contraseña">Contraseña</label>
                        <br>
                        <input type="password" name="campo-contraseña" id="" placeholder="••••••••">
                        <span class="mensaje-error" id="mensaje-contraseña"></span>
                    </div>

                    <br>
                    <button type="button" id="boton-ingresar" onclick="ingresar()">Ingresar</button>
                </fieldset>
            </form>
        </div>
    </div>
</body>

</html>
