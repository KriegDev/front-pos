<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Punto de Venta</title>
    <link rel="stylesheet" href="estilos.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <script src="funciones.js" defer></script>
</head>
<body>
    <div id="dashboard">
        <div id="barra_lateral">
            <nav>
                <h3>El Rincón de la Tía Ceci</h1>
                <ul>
                    <li id="boton_dashboard">
                        <button onclick="mostrarDashboard()">🏠Dashboard</button>
                    </li>
                    <li id="boton_nuevaVenta"> 
                        <button onclick="mostrarNuevaVenta()">🛒Nueva Venta</button>
                    </li>
                    <li id="boton_mostrarProductos"> 
                        <button onclick="mostrarProductos()">📦Productos</button>
                    </li>
                    <li id="boton_Clientes"> 
                        <button onclick="mostrarClientes()">👥Clientes</button>
                    </li>
                    <li id="boton_inventario"> 
                        <button onclick="mostrarInventario()">📊Inventario</button>
                    </li>
                    <li id="boton_ventas"> 
                        <button onclick="mostrarVentas()">🧾Ventas</button>
                    </li>
                    <li id="boton_pagos"> 
                        <button onclick="mostrarPagos()">💳Pagos</button>
                    </li>
                    <li id="boton_facturas"> 
                        <button onclick="mostrarFacturas()">🧾Facturas</button>
                    </li>
                    <li id="boton_proveedores"> 
                        <button onclick="mostrarProveedores()">🚚Proveedores</button>
                    </li>
                    <li id="boton_reportes"> 
                        <button onclick="mostrarReportes()">📈Reportes</button>
                    </li>
                    <li id="boton_notificaciones"> 
                        <button onclick="mostrarNotificaciones()">🔔Notificaciones</button>
                    </li>
                    <li id="boton_usuarios"> 
                        <button onclick="mostrarUsuarios()">⚙️Usuarios</button>
                    </li>
                    <li id="boton_salir"> 
                        <button onclick="mostrarSalir()">🚪Salir</button>
                    </li>
                </ul>
            </nav>
        </div>
        <div id="zona_principal">
            <h1>DASHBOARD</h1>
        </div>
    </div>
    <div id="cuadro-pago" class="cuadro-oculto">
        <div class="cuadro-contenido">
            <h3>Finalizar Venta</h3>
            <p id="pago-total">Total a pagar: $0</p>
            <p>Seleccione método de pago:</p>
            <div class="met-pago">
                <button type="button" onclick="procesarPago('Efectivo')">Efectivo</button>
                <button type="button" onclick="procesarPago('Tarjeta')">Tarjeta</button>
            </div>
            <br>
            <button type="button" id="btn-cerrar-cuadro" onclick="cerrarCuadro()">Cerrar</button>
        </div>
    </div>

    <div id="cuadro-facturas" class="cuadro-oculto">
        <div class="cuadro-contenido">
            <h3>Nueva Factura</h3>
            <p>N° 00046</p>
            <p>Orden #000127</p>
            <p>Total: $13.590</p>
            <div class="met-pago">
                <button type="button" onclick="generarNuevaFactura()">Generar</button>
                <button type="button" onclick="editarFactura()">Editar</button>
            </div>
            <br>
            <button type="button" id="btn-cerrar-cuadro" onclick="cerrarCuadroFacturas()">Cerrar</button>
        </div>
    </div>
</body>
</html>
